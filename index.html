
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オリキャラ 資料アーカイブ (data/ 検知)</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #3b82f6;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;
    --log-bg: #fffbeb;
    --log-border: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-folder {
    background: var(--primary);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    font-size: 0.95rem;
  }
  .btn-folder:hover { background: #2563eb; }
  input[type="text"] {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .guide {
    background: var(--card);
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--sub);
  }
  .char-section {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 28px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .char-header {
    background: #f8fafc;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .char-name {
    font-size: 1.2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badges {
    display: flex;
    gap: 6px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: bold;
  }
  .b-img { background: #dcfce7; color: #166534; }
  .b-txt { background: #dbeafe; color: #1e40af; }
  .b-aud { background: #f3e8ff; color: #6b21a8; }
  .b-log { background: #fef3c7; color: #92400e; }

  .char-content {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .block-title {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 画像ギャラリー */
  .img-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .img-list img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  /* テキスト */
  .txt-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .file-label {
    font-size: 0.75rem;
    color: var(--sub);
    margin-bottom: 4px;
    font-weight: bold;
  }
  /* 音声 */
  .audio-item {
    background: #faf5ff;
    border: 1px solid #e9d5ff;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .audio-item audio {
    width: 100%;
    height: 36px;
    margin-top: 6px;
  }
  /* 日々ログ (?log) */
  .log-box {
    background: var(--log-bg);
    border-left: 4px solid var(--log-border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  svg { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>
    <!-- フォルダSVG -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" style="width:24px;height:24px;">
      <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
    </svg>
    オリキャラ 資料データベース
  </h1>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="キャラ名・テキスト・ログ検索...">
    <label class="btn-folder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
      data/ フォルダを読み込む
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">
    </label>
  </div>
</header>

<main id="mainArea">
  <div class="guide">
    <p style="font-size:1.1rem; font-weight:bold; color:#334155;">上の「data/ フォルダを読み込む」ボタンからフォルダを選択してください</p>
    <p>フォルダ内の <b>画像・テキスト・音声</b> と、1行目に <b><code>?log</code></b> が書かれた日々ログファイルを自動判別して表示します。</p>
  </div>
</main>

<script>
  // 分かりやすいSVGアイコン定義
  const ICONS = {
    user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>`,
    image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`,
    text: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>`,
    audio: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
    log: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>`
  };

  let charGroups = {};

  document.getElementById('folderInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    charGroups = {};

    for (const file of files) {
      // パス解析: data/キャラ名/ファイル名 または 選択フォルダ/キャラ名/ファイル名
      const parts = file.webkitRelativePath.split('/');
      if (parts.length < 2) continue;

      // data/ 階層を探す（見つからなければルート直下のフォルダ名をキャラ名とする）
      const dataIdx = parts.indexOf('data');
      const charName = (dataIdx !== -1 && parts.length > dataIdx + 2)
        ? parts[dataIdx + 1]
        : (parts.length >= 3 ? parts[1] : '未分類');

      if (file.name.startsWith('.')) continue; // 隠しファイル除外

      if (!charGroups[charName]) {
        charGroups[charName] = { images: [], texts: [], audios: [], logs: [] };
      }

      const ext = file.name.split('.').pop().toLowerCase();

      // 1. 画像検知
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
        charGroups[charName].images.push({
          name: file.name,
          url: URL.createObjectURL(file)
        });
      }
      // 2. 音声検知
      else if (['mp3', 'wav', 'ogg', 'm4a', 'aac'].includes(ext)) {
        charGroups[charName].audios.push({
          name: file.name,
          url: URL.createObjectURL(file)
        });
      }
      // 3. テキスト & ?log 検知
      else if (['txt', 'md', 'log', 'csv', 'json'].includes(ext)) {
        const rawText = await file.text();
        const lines = rawText.replace(/\r\n/g, '\n').split('\n');
        const firstLine = lines.trim();

        if (firstLine === '?log' || firstLine.startsWith('?log ')) {
          // 1行目が ?log の場合は「日々ログ」として分類（1行目を除いた本文を格納）
          const body = lines.slice(1).join('\n').trim();
          charGroups[charName].logs.push({
            name: file.name,
            header: firstLine.replace(/^\?log\s*/, ''),
            content: body
          });
        } else {
          charGroups[charName].texts.push({
            name: file.name,
            content: rawText
          });
        }
      }
    }

    renderAll();
  });

  document.getElementById('searchBox').addEventListener('input', renderAll);

  function renderAll() {
    const main = document.getElementById('mainArea');
    const query = document.getElementById('searchBox').value.toLowerCase().trim();
    const names = Object.keys(charGroups).sort();

    if (names.length === 0) {
      main.innerHTML = `<div class="guide">有効なキャラクターデータが見つかりませんでした。</div>`;
      return;
    }

    main.innerHTML = '';

    for (const name of names) {
      const data = charGroups[name];

      // 検索フィルタリング
      const allText = [
        name,
        ...data.texts.map(t => t.content),
        ...data.logs.map(l => l.header + ' ' + l.content)
      ].join(' ').toLowerCase();

      if (query && !allText.includes(query)) continue;

      const section = document.createElement('section');
      section.className = 'char-section';

      // バッジ生成
      const badgesHtml = `
        ${data.images.length ? `<span class="badge b-img">${ICONS.image} 画像 ${data.images.length}</span>` : ''}
        ${data.texts.length ? `<span class="badge b-txt">${ICONS.text} テキスト ${data.texts.length}</span>` : ''}
        ${data.audios.length ? `<span class="badge b-aud">${ICONS.audio} 音声 ${data.audios.length}</span>` : ''}
        ${data.logs.length ? `<span class="badge b-log">${ICONS.log} 日々ログ ${data.logs.length}</span>` : ''}
      `;

      // 画像ブロック
      const imgHtml = data.images.length ? `
        <div>
          <div class="block-title">${ICONS.image} 画像・立ち絵</div>
          <div class="img-list">
コードは注意してご使用ください。
${data.images.map(img => <img src="${img.url}" title="${esc(img.name)}" onclick="window.open('${img.url}')">).join('')}

` : '';
// テキストブロック
const txtHtml = data.texts.length ? <div> <div class="block-title">${ICONS.text} 設定テキスト</div> ${data.texts.map(t =>

${esc(t.name)}
${esc(t.content)}

).join('')} </div> : '';
// 音声ブロック
const audHtml = data.audios.length ? <div> <div class="block-title">${ICONS.audio} ボイス・音声</div> ${data.audios.map(a =>

${esc(a.name)}
).join('')} </div> : '';
// ?log（日々ログ）ブロック
const logHtml = data.logs.length ? <div> <div class="block-title">${ICONS.log} 日々の記録 (?log)</div> ${data.logs.map(l =>

${esc(l.name)} ${l.header ? — ${esc(l.header)} : ''}
${esc(l.content)}

).join('')} </div> : '';
section.innerHTML = <div class="char-header"> <div class="char-name">${ICONS.user} ${esc(name)}</div> <div class="badges">${badgesHtml}</div> </div> <div class="char-content"> ${imgHtml} ${txtHtml} ${audHtml} ${logHtml} </div>;
main.appendChild(section);
}
}
function esc(str) {
return (str || '').replace(/[&<>"']/g, m => ({
'&': '&', '<': '<', '>': '>', '"': '"', "'": '''
}[m]));
}
