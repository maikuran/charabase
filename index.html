<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オリキャラ資料データベース</title>

<style>
:root {
  --bg:#f1f5f9;
  --card:#fff;
  --primary:#3b82f6;
  --text:#1e293b;
  --sub:#64748b;
  --border:#e2e8f0;
  --green:#dcfce7;
  --blue:#dbeafe;
  --purple:#f3e8ff;
  --yellow:#fef3c7;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans JP",Meiryo,sans-serif;
}
svg{
  width:20px;height:20px;flex-shrink:0;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
header{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:12px;
  padding:14px 22px;background:white;
  border-bottom:1px solid var(--border);
}
h1{
  display:flex;align-items:center;gap:9px;
  margin:0;font-size:1.2rem;
}
h1 svg{width:27px;height:27px;color:var(--primary)}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
input[type=text]{
  min-width:230px;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  font-size:14px;
}
button,.folder-button{
  display:inline-flex;align-items:center;justify-content:center;
  gap:7px;padding:9px 13px;border:1px solid var(--border);
  border-radius:8px;background:#f8fafc;color:var(--text);
  font-weight:bold;cursor:pointer;font-size:13px;
}
button:hover,.folder-button:hover{background:#e2e8f0}
button.primary{background:var(--primary);color:white;border-color:var(--primary)}
button.primary:hover{background:#2563eb}
main{max-width:1150px;margin:25px auto;padding:0 16px}
.guide{
  padding:38px 20px;text-align:center;color:var(--sub);
  background:white;border:2px dashed #cbd5e1;border-radius:12px;
}
.guide>svg{width:42px;height:42px;color:var(--primary)}
.repo-config{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:8px;margin-top:16px;
}
.repo-config input{min-width:150px}
.status{margin-top:12px;font-size:13px;color:var(--sub)}
.error{color:#b91c1c}
.char-section{
  margin-bottom:24px;background:white;overflow:hidden;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 2px 6px #00000008;
}
.char-header{
  display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:10px;
  padding:14px 18px;background:#f8fafc;
  border-bottom:1px solid var(--border);
}
.char-name{
  display:flex;align-items:center;gap:9px;
  margin:0;font-size:1.15rem;
}
.char-name svg{color:var(--primary)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;
  font-size:12px;font-weight:bold;
}
.badge svg{width:15px;height:15px}
.b-img{background:var(--green);color:#166534}
.b-txt{background:var(--blue);color:#1e40af}
.b-aud{background:var(--purple);color:#6b21a8}
.b-log{background:var(--yellow);color:#92400e}
.char-content{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;padding:20px;
}
.block-title{
  display:flex;align-items:center;gap:7px;
  margin-bottom:10px;color:var(--sub);
  font-size:13px;font-weight:bold;
}
.img-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
  gap:10px;
}
.img-item img{
  display:block;width:100%;height:135px;
  object-fit:cover;border:1px solid var(--border);
  border-radius:8px;cursor:zoom-in;
  transition:transform .15s;
}
.img-item img:hover{transform:scale(1.025)}
.img-item p{
  margin:5px 0 0;font-size:12px;color:var(--sub);
  overflow-wrap:anywhere;
}
.text-item,.log-item,.audio-item{
  margin-bottom:10px;padding:12px;
  border:1px solid var(--border);border-radius:8px;
}
.text-item{background:#f8fafc}
.log-item{background:var(--yellow);border-left:4px solid #f59e0b}
.audio-item{background:#faf5ff;border-color:#e9d5ff}
.item-title{font-size:13px;font-weight:bold;margin-bottom:7px;overflow-wrap:anywhere}
.item-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}
.log-header{font-weight:bold;color:#92400e;margin-bottom:6px}
.audio-item audio{width:100%;margin-top:5px}
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;justify-content:center;align-items:center;
  padding:20px;background:#0f172ae8;cursor:zoom-out;
}
.modal.active{display:flex}
.modal img{max-width:95%;max-height:92vh;object-fit:contain;border-radius:8px}
@media(max-width:650px){
  header{padding:12px}
  header h1{font-size:1rem}
  .controls{width:100%}
  .controls input[type=text]{flex:1;min-width:0}
  .char-content{grid-template-columns:1fr;padding:14px}
  main{margin-top:15px}
}
</style>
</head>

<body>

<header>
  <h1>
    <svg viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M3 9h18"/>
    </svg>
    オリキャラ 資料データベース
  </h1>

  <div class="controls">
    <input id="searchBox" type="text" placeholder="キャラ名・資料・ログを検索...">

    <label class="folder-button">
      <svg viewBox="0 0 24 24">
        <path d="M12 16V3"/>
        <path d="m7 8 5-5 5 5"/>
        <path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
      </svg>
      ローカル読込
      <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
    </label>
  </div>
</header>

<main id="mainArea">
  <div class="guide">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </svg>
    <p>GitHubから資料を読み込んでいます...</p>
  </div>
</main>

<div class="modal" id="imgModal">
  <img id="modalImg" alt="画像プレビュー">
</div>

<script>
"use strict";

/* =========================================
   GitHub リポジトリ設定
========================================= */

const REPO = {
  owner: "maikuran",
  repo: "charabase",
  branch: ""
};

/* =========================================
   SVGアイコン
========================================= */

const ICONS = {
  user: `
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </svg>`,

  image: `
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="m21 15-5-5L5 21"/>
    </svg>`,

  text: `
    <svg viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
      <path d="M8 13h8M8 17h8M8 9h1"/>
    </svg>`,

  audio: `
    <svg viewBox="0 0 24 24">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>`,

  log: `
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="17" rx="2"/>
      <path d="M16 2v4M8 2v4M3 10h18"/>
      <path d="M8 14h.01M12 14h.01M16 14h.01"/>
      <path d="M8 17h.01M12 17h.01"/>
    </svg>`,

  folder: `
    <svg viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>`,

  search: `
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </svg>`
};

const IMG_EXTS = ["png","jpg","jpeg","gif","webp","svg"];
const AUD_EXTS = ["mp3","wav","ogg","m4a","aac"];
const TXT_EXTS = ["txt","md","log","csv","json"];

let charGroups = {};
let objectUrls = [];

/* =========================================
   共通処理
========================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getExtension(name) {
  const index = name.lastIndexOf(".");
  return index < 0 ? "" : name.slice(index + 1).toLowerCase();
}

function ensureGroup(name) {
  if (!charGroups[name]) {
    charGroups[name] = {
      images: [],
      texts: [],
      audios: [],
      logs: []
    };
  }
  return charGroups[name];
}

function classifyTextContent(charName, fileName, rawText) {
  const group = ensureGroup(charName);
  const lines = String(rawText).replace(/\r\n/g, "\n").split("\n");
  const firstLine = (lines[0] || "").trim();

  if (firstLine === "?log" || firstLine.startsWith("?log ")) {
    group.logs.push({
      name: fileName,
      header: firstLine.replace(/^\?log\s*/, ""),
      body: lines.slice(1).join("\n").trim()
    });
  } else {
    group.texts.push({
      name: fileName,
      body: rawText.trim()
    });
  }
}

/* =========================================
   GitHub API
========================================= */

async function githubApi(url) {
  const response = await fetch(url, {
    headers: {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    }
  });

  if (!response.ok) {
    let message = "";
    try {
      const data = await response.json();
      message = data.message || "";
    } catch (_) {}

    if (response.status === 403) {
      throw new Error(
        "GitHub APIの利用制限です。少し時間をおいて再試行してください。" +
        (message ? " " + message : "")
      );
    }

    if (response.status === 404) {
      throw new Error(
        "リポジトリまたはブランチが見つかりません。"
      );
    }

    throw new Error(
      `GitHub APIエラー: HTTP ${response.status} ${message}`
    );
  }

  return response.json();
}

function makeRawUrl(owner, repo, branch, path) {
  const encodedPath = path
    .split("/")
    .map(encodeURIComponent)
    .join("/");

  return `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${encodeURIComponent(branch)}/${encodedPath}`;
}

/* =========================================
   GitHub資料読み込み
========================================= */

async function loadFromGitHub(
  owner = REPO.owner,
  repo = REPO.repo,
  branchInput = REPO.branch
) {
  const main = document.getElementById("mainArea");

  main.innerHTML = `
    <div class="guide">
      ${ICONS.search}
      <p><b>${escapeHtml(owner)}/${escapeHtml(repo)}</b></p>
      <p>GitHub APIから資料を取得しています...</p>
    </div>
  `;

  try {
    let branch = branchInput;

    /* デフォルトブランチ取得 */
    if (!branch) {
      const repoData = await githubApi(
        `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`
      );

      branch = repoData.default_branch;

      if (!branch) {
        throw new Error("デフォルトブランチを取得できません。");
      }
    }

    /* Git Trees API */
    const treeUrl =
      `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}` +
      `/git/trees/${encodeURIComponent(branch)}?recursive=1`;

    const treeData = await githubApi(treeUrl);

    if (treeData.truncated) {
      throw new Error(
        "ファイル数が多すぎてGitHub APIの取得上限を超えました。"
      );
    }

    const dataFiles = (treeData.tree || []).filter(item =>
      item.type === "blob" &&
      item.path.startsWith("data/")
    );

    if (dataFiles.length === 0) {
      main.innerHTML = `
        <div class="guide">
          ${ICONS.folder}
          <p>data/ フォルダに資料がありません。</p>
        </div>
      `;
      return;
    }

    charGroups = {};

    const textTasks = [];

    for (const item of dataFiles) {
      const parts = item.path.split("/");
      const fileName = parts[parts.length - 1];

      if (!fileName || fileName.startsWith(".")) continue;

      const charName = parts.length >= 3
        ? parts[1]
        : "未分類";

      const group = ensureGroup(charName);
      const ext = getExtension(fileName);

      const rawUrl = makeRawUrl(
        owner,
        repo,
        branch,
        item.path
      );

      if (IMG_EXTS.includes(ext)) {
        group.images.push({
          name: item.path,
          url: rawUrl
        });

      } else if (AUD_EXTS.includes(ext)) {
        group.audios.push({
          name: fileName,
          url: rawUrl
        });

      } else if (TXT_EXTS.includes(ext)) {
        textTasks.push(
          fetch(rawUrl).then(async response => {
            if (!response.ok) {
              throw new Error(
                `${item.path} の読み込みに失敗しました。`
              );
            }

            const content = await response.text();

            classifyTextContent(
              charName,
              fileName,
              content
            );
          })
        );
      }
    }

    await Promise.all(textTasks);

    render(document.getElementById("searchBox").value);

  } catch (error) {
    console.error(error);

    main.innerHTML = `
      <div class="guide">
        ${ICONS.folder}
        <p class="error">${escapeHtml(error.message)}</p>
        <p>リポジトリ: ${escapeHtml(owner)}/${escapeHtml(repo)}</p>
        <button class="primary" id="retryButton">
          ${ICONS.search}
          再読み込み
        </button>
      </div>
    `;

    document.getElementById("retryButton").addEventListener(
      "click",
      () => loadFromGitHub(owner, repo, branchInput)
    );
  }
}

/* =========================================
   ローカルフォルダ読み込み
========================================= */

document.getElementById("folderInput").addEventListener(
  "change",
  async event => {
    const files = Array.from(event.target.files);

    if (!files.length) return;

    objectUrls.forEach(url => URL.revokeObjectURL(url));
    objectUrls = [];
    charGroups = {};

    for (const file of files) {
      const parts = file.webkitRelativePath.split("/");
      const dataIndex = parts.indexOf("data");

      let charName;

      if (dataIndex !== -1 && parts.length > dataIndex + 2) {
        charName = parts[dataIndex + 1];
      } else if (parts.length >= 3) {
        charName = parts[parts.length - 2];
      } else {
        charName = "未分類";
      }

      if (file.name.startsWith(".")) continue;

      const group = ensureGroup(charName);
      const ext = getExtension(file.name);

      if (IMG_EXTS.includes(ext)) {
        const url = URL.createObjectURL(file);
        objectUrls.push(url);

        group.images.push({
          name: file.name,
          url
        });

      } else if (AUD_EXTS.includes(ext)) {
        const url = URL.createObjectURL(file);
        objectUrls.push(url);

        group.audios.push({
          name: file.name,
          url
        });

      } else if (TXT_EXTS.includes(ext)) {
        const content = await file.text();

        classifyTextContent(
          charName,
          file.name,
          content
        );
      }
    }

    render(document.getElementById("searchBox").value);
  }
);

/* =========================================
   画像プレビュー
========================================= */

function openModal(url) {
  document.getElementById("modalImg").src = url;
  document.getElementById("imgModal").classList.add("active");
}

document.getElementById("imgModal").addEventListener(
  "click",
  () => {
    document.getElementById("imgModal").classList.remove("active");
    document.getElementById("modalImg").src = "";
  }
);

/* =========================================
   検索
========================================= */

function includesText(value, query) {
  return String(value || "")
    .toLocaleLowerCase()
    .includes(query);
}

document.getElementById("searchBox").addEventListener(
  "input",
  event => render(event.target.value)
);

/* =========================================
   画面描画
========================================= */

function render(query = "") {
  const main = document.getElementById("mainArea");
  const q = query.trim().toLocaleLowerCase();

  const names = Object.keys(charGroups).sort(
    (a, b) => a.localeCompare(b, "ja")
  );

  if (!names.length) {
    main.innerHTML = `
      <div class="guide">
        ${ICONS.folder}
        <p>資料がありません。</p>
      </div>
    `;
    return;
  }

  let html = "";
  let visibleCount = 0;

  for (const name of names) {
    const group = charGroups[name];
    const nameMatch = includesText(name, q);

    const images = nameMatch
      ? group.images
      : group.images.filter(x => includesText(x.name, q));

    const audios = nameMatch
      ? group.audios
      : group.audios.filter(x => includesText(x.name, q));

    const texts = nameMatch
      ? group.texts
      : group.texts.filter(x =>
          includesText(x.name, q) ||
          includesText(x.body, q)
        );

    const logs = nameMatch
      ? group.logs
      : group.logs.filter(x =>
          includesText(x.name, q) ||
          includesText(x.header, q) ||
          includesText(x.body, q)
        );

    if (
      !images.length &&
      !audios.length &&
      !texts.length &&
      !logs.length
    ) continue;

    visibleCount++;

    html += `
      <section class="char-section">

        <div class="char-header">
          <h2 class="char-name">
            ${ICONS.user}
            ${escapeHtml(name)}
          </h2>

          <div class="badges">
            ${
              images.length
                ? `<span class="badge b-img">
                    ${ICONS.image} 画像 ${images.length}
                  </span>`
                : ""
            }

            ${
              texts.length
                ? `<span class="badge b-txt">
                    ${ICONS.text} テキスト ${texts.length}
                  </span>`
                : ""
            }

            ${
              audios.length
                ? `<span class="badge b-aud">
                    ${ICONS.audio} 音声 ${audios.length}
                  </span>`
                : ""
            }

            ${
              logs.length
                ? `<span class="badge b-log">
                    ${ICONS.log} ログ ${logs.length}
                  </span>`
                : ""
            }
          </div>
        </div>

        <div class="char-content">
    `;

    /* 画像資料 */
    if (images.length) {
      html += `
        <div>
          <div class="block-title">
            ${ICONS.image}
            画像資料
          </div>

          <div class="img-list">
            ${images.map(img => `
              <div class="img-item">
                <img
                  src="${escapeHtml(img.url)}"
                  alt="${escapeHtml(img.name)}"
                  loading="lazy"
                  data-preview="${escapeHtml(img.url)}"
                >
                <p>${escapeHtml(img.name)}</p>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* テキスト資料 */
    if (texts.length) {
      html += `
        <div>
          <div class="block-title">
            ${ICONS.text}
            設定・テキスト
          </div>

          ${texts.map(item => `
            <div class="text-item">
              <div class="item-title">
                ${escapeHtml(item.name)}
              </div>
              <div class="item-body">${escapeHtml(item.body)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    /* ログ */
    if (logs.length) {
      html += `
        <div>
          <div class="block-title">
            ${ICONS.log}
            日々ログ
          </div>

          ${logs.map(item => `
            <div class="log-item">
              <div class="item-title">
                ${escapeHtml(item.name)}
              </div>

              ${
                item.header
                  ? `<div class="log-header">${escapeHtml(item.header)}</div>`
                  : ""
              }

              <div class="item-body">${escapeHtml(item.body)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    /* 音声 */
    if (audios.length) {
      html += `
        <div>
          <div class="block-title">
            ${ICONS.audio}
            ボイス・音声
          </div>

          ${audios.map(item => `
            <div class="audio-item">
              <div class="item-title">
                ${escapeHtml(item.name)}
              </div>
              <audio controls preload="none" src="${escapeHtml(item.url)}"></audio>
            </div>
          `).join("")}
        </div>
      `;
    }

    html += `
        </div>
      </section>
    `;
  }

  if (!visibleCount) {
    main.innerHTML = `
      <div class="guide">
        ${ICONS.search}
        <p>「${escapeHtml(query)}」に一致する資料はありません。</p>
      </div>
    `;
  } else {
    main.innerHTML = html;
  }
}

/* 動的に追加された画像のクリック処理 */
document.getElementById("mainArea").addEventListener(
  "click",
  event => {
    const image = event.target.closest("img[data-preview]");
    if (image) {
      openModal(image.dataset.preview);
    }
  }
);

/* =========================================
   起動
========================================= */

window.addEventListener("DOMContentLoaded", () => {
  loadFromGitHub(
    REPO.owner,
    REPO.repo,
    REPO.branch
  );
});
</script>

</body>
</html>
