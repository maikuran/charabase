
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オリキャラ 資料アーカイブ (リポジトリ data/ 自動検知)</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #3b82f6;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;
    --log-bg: #fffbeb;
    --log-border: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-folder {
    background: #f8fafc;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.88rem;
    transition: background 0.15s;
  }
  .btn-folder:hover { background: #e2e8f0; }
  input[type="text"] {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    min-width: 240px;
  }
  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .guide {
    background: var(--card);
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--sub);
  }
  .repo-config {
    margin-top: 16px;
    display: inline-flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .repo-config input {
    min-width: 180px;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-primary:hover { background: #2563eb; }
  .char-section {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 28px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .char-header {
    background: #f8fafc;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .char-name {
    font-size: 1.2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: bold;
  }
  .b-img { background: #dcfce7; color: #166534; }
  .b-txt { background: #dbeafe; color: #1e40af; }
  .b-aud { background: #f3e8ff; color: #6b21a8; }
  .b-log { background: #fef3c7; color: #92400e; }

  .char-content {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .block-title {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .img-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .img-list img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .img-list img:hover { transform: scale(1.03); }
  .txt-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .file-label {
    font-size: 0.75rem;
    color: var(--sub);
    margin-bottom: 4px;
    font-weight: bold;
  }
  .audio-item {
    background: #faf5ff;
    border: 1px solid #e9d5ff;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .audio-item audio {
    width: 100%;
    height: 36px;
    margin-top: 6px;
  }
  .log-box {
    background: var(--log-bg);
    border-left: 4px solid var(--log-border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .log-header {
    font-weight: bold;
    color: #92400e;
    margin-bottom: 4px;
    font-size: 0.85rem;
  }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .modal.active { display: flex; }
  .modal img {
    max-width: 95%;
    max-height: 92vh;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  svg { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" style="width:24px;height:24px;">
      <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
    </svg>
    オリキャラ 資料データベース
  </h1>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="キャラ名・テキスト・ログ検索...">
    <label class="btn-folder" title="ローカルPCのフォルダから直接読み込む場合">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
      ローカル読込
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">
    </label>
  </div>
</header>

<main id="mainArea">
  <div class="guide">
    <p>リポジトリ内の <code>data/</code> フォルダを検知しています...</p>
  </div>
</main>

<div class="modal" id="imgModal" onclick="this.classList.remove('active')">
  <img id="modalImg" src="" alt="拡大プレビュー">
</div>

<script>
  // ★ 手動でリポジトリを指定したい場合はここに記入（空欄ならGitHub PagesのURLから自動判別）
  const REPO_CONFIG = {
    owner: '',   // 例: 'your-username'
    repo: '',    // 例: 'oc-archive'
    branch: ''   // 空欄ならデフォルトブランチ(main/master)を自動取得
  };

  const ICONS = {
    user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>`,
    image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`,
    text: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>`,
    audio: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
    log: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>`
  };

  const IMG_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];
  const AUD_EXTS = ['mp3', 'wav', 'ogg', 'm4a', 'aac'];
  const TXT_EXTS = ['txt', 'md', 'log', 'csv', 'json'];

  let charGroups = {};
  let objectUrls = [];

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function openModal(url) {
    document.getElementById('modalImg').src = url;
    document.getElementById('imgModal').classList.add('active');
  }

  // テキスト内容を解析して texts または logs に振り分ける共通関数
  function classifyTextContent(charName, fileName, rawText) {
    const lines = rawText.replace(/\r\n/g, '\n').split('\n');
    const firstLine = (lines || '').trim();

    if (firstLine === '?log' || firstLine.startsWith('?log ')) {
      const body = lines.slice(1).join('\n').trim();
      charGroups[charName].logs.push({
        name: fileName,
        header: firstLine.replace(/^\?log\s*/, ''),
        body
      });
    } else {
      charGroups[charName].texts.push({
        name: fileName,
        body: rawText.trim()
      });
    }
  }

  // URLからGitHubオーナー・リポジトリ名を自動検出
  function detectGitHubRepo() {
    if (REPO_CONFIG.owner && REPO_CONFIG.repo) {
      return { owner: REPO_CONFIG.owner, repo: REPO_CONFIG.repo, branch: REPO_CONFIG.branch };
    }
    const host = window.location.hostname;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const owner = host.replace('.github.io', '');
      const repo = pathParts.length > 0 ? pathParts : `${owner}.github.io`;
      return { owner, repo, branch: REPO_CONFIG.branch };
    }
    return null;
  }

  // GitHubリポジトリ内の data/ を一括スキャンして読み込み
  async function loadFromGitHub(owner, repo, branchInput = '') {
    const main = document.getElementById('mainArea');
    main.innerHTML = `<div class="guide"><p>リポジトリ <b>${escapeHtml(owner)}/${escapeHtml(repo)}</b> の <code>data/</code> を読み込み中...</p></div>`;

    try {
      let branch = branchInput;
      if (!branch) {
        const repoRes = await fetch(`https://github.com{owner}/${repo}`);
        if (!repoRes.ok) throw new Error('リポジトリ情報の取得に失敗しました（非公開リポジトリか存在しません）');
        const repoData = await repoRes.json();
        branch = repoData.default_branch || 'main';
      }

      // リポジトリ全体のファイルツリーを取得
const treeRes = await fetch(`https://github.com{owner}/${repo}/git/trees/${branch}?recursive=1`);
if (!treeRes.ok) throw new Error('ファイル一覧の取得に失敗しました');
const treeData = await treeRes.json();
// data/ 配下のファイル(blob)のみ抽出
const dataFiles = (treeData.tree || []).filter(item =>
item.type === 'blob' && item.path.startsWith('data/')
);
if (dataFiles.length === 0) {
main.innerHTML = <div class="guide"><p>リポジトリ内に <code>data/</code> フォルダ、またはファイルが見つかりませんでした。</p></div>;
return;
}
charGroups = {};
const textTasks = [];
for (const item of dataFiles) {
// パス例: data/キャラ名/サブフォルダ/ファイル名
const parts = item.path.split('/');
const fileName = parts[parts.length - 1];
if (fileName.startsWith('.')) continue;
const charName = parts.length >= 3 ? parts : '未分類';
if (!charGroups[charName]) {
charGroups[charName] = { images: [], texts: [], audios: [], logs: [] };
}
const ext = fileName.split('.').pop().toLowerCase();
// 日本語ファイル名にも対応したRaw URL生成
const encodedPath = parts.map(encodeURIComponent).join('/');
const rawUrl = https://githubusercontent.com{owner}/${repo}/${branch}/${encodedPath};
if (IMG_EXTS.includes(ext)) {
charGroups[charName].images.push({ name: fileName, url: rawUrl });
} else if (AUD_EXTS.includes(ext)) {
charGroups[charName].audios.push({ name: fileName, url: rawUrl });
} else if (TXT_EXTS.includes(ext)) {
textTasks.push(
fetch(rawUrl)
.then(r => r.text())
.then(txt => classifyTextContent(charName, fileName, txt))
);
}
}
await Promise.all(textTasks);
render(document.getElementById('searchBox').value);
} catch (err) {
showManualRepoForm(自動検知できませんでした: ${err.message});
}
}
// 自動判別できない環境（ローカルfile://閲覧など）用の入力フォーム表示
function showManualRepoForm(message) {
const main = document.getElementById('mainArea');
main.innerHTML = `
${escapeHtml(message)}
GitHubの公開リポジトリを指定して data/ を読み込むか、右上の「ローカル読込」からフォルダを選択してください。
リポジトリ読込


`;
}
function manualLoadRepo() {
const owner = document.getElementById('inputOwner').value.trim();
const repo = document.getElementById('inputRepo').value.trim();
if (owner && repo) {
loadFromGitHub(owner, repo);
}
}
// ローカルフォルダ選択からの読み込み（フォールバック兼テスト用）
document.getElementById('folderInput').addEventListener('change', async (e) => {
const files = Array.from(e.target.files);
if (!files.length) return;
objectUrls.forEach(url => URL.revokeObjectURL(url));
objectUrls = [];
charGroups = {};
for (const file of files) {
const parts = file.webkitRelativePath.split('/');
if (parts.length < 2) continue;
const dataIdx = parts.indexOf('data');
const charName = (dataIdx !== -1 && parts.length > dataIdx + 2)
? parts[dataIdx + 1]
: (parts.length >= 3 ? parts : '未分類');
if (file.name.startsWith('.')) continue;
if (!charGroups[charName]) {
charGroups[charName] = { images: [], texts: [], audios: [], logs: [] };
}
const ext = file.name.split('.').pop().toLowerCase();
if (IMG_EXTS.includes(ext)) {
const url = URL.createObjectURL(file);
objectUrls.push(url);
charGroups[charName].images.push({ name: file.name, url });
} else if (AUD_EXTS.includes(ext)) {
const url = URL.createObjectURL(file);
objectUrls.push(url);
charGroups[charName].audios.push({ name: file.name, url });
} else if (TXT_EXTS.includes(ext)) {
const rawText = await file.text();
classifyTextContent(charName, file.name, rawText);
}
}
render(document.getElementById('searchBox').value);
});
document.getElementById('searchBox').addEventListener('input', (e) => {
render(e.target.value);
});
function render(query = '') {
const main = document.getElementById('mainArea');
const q = query.trim().toLowerCase();
const charNames = Object.keys(charGroups).sort((a, b) => a.localeCompare(b, 'ja'));
if (charNames.length === 0) {
main.innerHTML = <div class="guide"><p>対応するファイルが見つかりませんでした。</p></div>;
return;
}
let html = '';
let visibleCount = 0;
for (const name of charNames) {
const group = charGroups[name];
const nameMatch = name.toLowerCase().includes(q);
const images = nameMatch ? group.images : group.images.filter(i => i.name.toLowerCase().includes(q));
const audios = nameMatch ? group.audios : group.audios.filter(a => a.name.toLowerCase().includes(q));
const texts = nameMatch ? group.texts : group.texts.filter(t =>
t.name.toLowerCase().includes(q) || t.body.toLowerCase().includes(q)
);
const logs = nameMatch ? group.logs : group.logs.filter(l =>
l.name.toLowerCase().includes(q) || l.header.toLowerCase().includes(q) || l.body.toLowerCase().includes(q)
);
if (!images.length && !texts.length && !audios.length && !logs.length) continue;
visibleCount++;
html += `
${ICONS.user} ${escapeHtml(name)}

${images.length ? <span class="badge b-img">${ICONS.image} 画像 ${images.length}</span> : ''}
${texts.length ? <span class="badge b-txt">${ICONS.text} テキスト ${texts.length}</span> : ''}
${audios.length ? <span class="badge b-aud">${ICONS.audio} 音声 ${audios.length}</span> : ''}
${logs.length ? <span class="badge b-log">${ICONS.log} ログ ${logs.length}</span> : ''}



`;
if (images.length) {
html += <div> <div class="block-title">${ICONS.image} 画像資料</div> <div class="img-list"> ${images.map(img =>).join('')} </div> </div> ;
}
if (texts.length) {
html += <div> <div class="block-title">${ICONS.text} 設定・テキスト</div> ${texts.map(t =>

${escapeHtml(t.name)}
${escapeHtml(t.body)}

).join('')} </div> ;
}
if (logs.length) {
html += <div> <div class="block-title">${ICONS.log} 日々ログ (?log)</div> ${logs.map(l =>

${escapeHtml(l.name)}
${l.header ? <div class="log-header">${escapeHtml(l.header)}</div> : ''}
${escapeHtml(l.body)}

).join('')} </div> ;
}
if (audios.length) {
html += <div> <div class="block-title">${ICONS.audio} ボイス・音声</div> ${audios.map(a =>

${escapeHtml(a.name)}
).join('')} </div> ;
}
html += </div></section>;
}
if (visibleCount === 0) {
main.innerHTML = <div class="guide"><p>「${escapeHtml(query)}」に一致する資料は見つかりませんでした。</p></div>;
} else {
main.innerHTML = html;
}
}
// ページ読み込み時に自動実行
// ページ読み込み時に自動実行
window.addEventListener('DOMContentLoaded', () => {
  const detected = detectGitHubRepo();
  if (detected) {
    loadFromGitHub(detected.owner, detected.repo, detected.branch);
  } else {
    showManualRepoForm('GitHub Pages以外の環境で開かれています。');
  }
});
</script>
</body>
</html>
